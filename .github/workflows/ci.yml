name: RPSMS Zero-Trust CI Pipeline

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  validate:
    name: Code Quality & Security Test Pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Production Build
        run: npm run build

      - name: Run Schema Migrations Verification
        run: npm run test:migrations

      - name: Run Zero-Trust RLS & Security Test Suite
        run: npm run verify:rls

      - name: Audit Log SHA-256 Cryptographic Chain Verification
        run: npm run verify:audit
